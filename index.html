const today = () => new Date().toISOString().slice(0,10);
async function save(filename, data){
  try { await S.downloads.save({filename, data}); toast("Fichier enregistré"); }
  catch(e){ if (e?.code !== "declined") toast("Export indisponible ici."); }
}
function editLocation(id){
  const l = id ? S.locations.get(id) : {name:"", kind:""};
  openSheet(id ? l.name : "Nouvel emplacement", body => {
    const units = id ? prods().reduce((s,p)=>s+qp(p,id),0) : 0;
    body.innerHTML = `<form id="lf">
      <div class="field"><label for="l-name">Nom</label><input id="l-name" value="${esc(l.name)}" placeholder="Réserve" required></div>
      <div class="field"><label for="l-city">Ville</label><input id="l-city" list="citylist" value="${esc(l.city||"")}" placeholder="Nantes" autocomplete="off"><datalist id="citylist">${Object.keys(CITIES).map(c=>`<option value="${esc(c)}">`).join("")}</datalist><span class="hint">Sert à placer le point vert sur la carte.</span></div>
      <details ${l.city && !cityCoords(l.city) ? "open" : ""}><summary class="hint" style="margin-bottom:10px;cursor:pointer">Ville absente de la liste ? Entre ses coordonnées</summary>
        <div class="grid2"><div class="field"><label for="l-lat">Latitude</label><input id="l-lat" inputmode="decimal" value="${esc(l.lat ?? "")}" placeholder="47.218"></div><div class="field"><label for="l-lng">Longitude</label><input id="l-lng" inputmode="decimal" value="${esc(l.lng ?? "")}" placeholder="-1.553"></div></div></details>
      <div class="field"><label for="l-kind">Type</label><select id="l-kind">${["","Stock personnel","En ligne","Boutique","Magasin GET IN MY SHOES","Dépôt-vente","Réserve","Événement"].map(k=>`<option ${l.kind===k?"selected":""} value="${k}">${k||"—"}</option>`).join("")}</select></div>
      <div class="actions"><button class="btn primary" type="submit">${id?"Enregistrer":"Ajouter"}</button></div>
      ${id ? `<div class="actions"><button type="button" class="btn danger" id="ldel">Supprimer l'emplacement</button></div><p class="note">${units ? `Il contient encore ${int(units)} pièces : leurs quantités disparaîtront des totaux.` : "Aucune pièce n'y est stockée."}</p>` : ""}
    </form>`;
    $("#lf").onsubmit = async e => {
      e.preventDefault(); const name = $("#l-name").value.trim(); if (!name){ toast("Donne un nom à l'emplacement."); return; }
      const lid = id || uid();
      const city = $("#l-city").value.trim(); const known = city ? cityCoords(city) : null;
      const mlat = parseFloat(String($("#l-lat").value).replace(",", ".")), mlng = parseFloat(String($("#l-lng").value).replace(",", "."));
      const manual = Number.isFinite(mlat) && Number.isFinite(mlng);
      const changedManual = manual && (mlat !== Number(l.lat) || mlng !== Number(l.lng));
      let lat = null, lng = null;
      if (known && !changedManual) [lat, lng] = known; else if (manual) { lat = mlat; lng = mlng; }
      if (city && lat === null){ toast("Ville inconnue : choisis-la dans la liste ou entre ses coordonnées."); return; }
      const ok = await write(() => S.db.doc("locations/"+lid).set({...(l.billing ? {billing:l.billing} : {}), name, kind:$("#l-kind").value, city: known ? Object.keys(CITIES).find(c => slug(c) === slug(city)) : city, lat, lng, order: l.order ?? Date.now()}), id ? "Emplacement enregistré" : "Emplacement ajouté");
      if (ok) closeSheet();
    };
    $("#ldel") && armDelete($("#ldel"), "Toucher encore pour supprimer", async () => {
      await write(() => S.db.doc("locations/"+id).delete(), "Emplacement supprimé"); closeSheet();
    });
  });
}

/* ---------- boot ---------- */
render();
(async () => {
  const [db, user, assets, downloads] = await Promise.all(["db","user","assets","downloads"].map(n => window.claude?.use ? window.claude.use(n).catch(()=>null) : Promise.resolve(null)));
  S.db = db; S.assets = assets; S.downloads = downloads; S.ready = true;
  if (!db){ $("#syncState").textContent = "hors ligne"; $("#syncState").classList.add("off"); render(); return; }
  try { const w = await user?.can?.("data.write"); if (w === false) S.canWrite = false; } catch(e){}
  $("#syncState").textContent = "local";
  const onErr = e => { if (e?.code === "revoked"){ S.db = null; $("#syncState").textContent = "accès retiré"; } else $("#syncState").textContent = "connexion interrompue"; scheduleRender(); };
  const intoMap = (map) => snap => { map.clear(); snap.docs.forEach(d => map.set(d.id, {id:d.id, ...d.data()})); scheduleRender(); };
  db.collection("products").onSnapshot(intoMap(S.products), onErr);
  db.collection("collections").onSnapshot(intoMap(S.collections), onErr);
  db.collection("locations").onSnapshot(intoMap(S.locations), onErr);
  db.doc("settings/main").onSnapshot(s => { if (s.exists) S.settings = {lowThreshold:2, ...s.data()}; scheduleRender(); }, onErr);
  db.collection("transfers").onSnapshot(snap => { S.transfers = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (b.t||0) - (a.t||0)); scheduleRender(); }, onErr);
  db.collection("invoices").onSnapshot(snap => { S.invoices = snap.docs.map(d => ({id:d.id, ...d.data()})); scheduleRender(); }, onErr);
  db.collection("sales").onSnapshot(snap => { S.sales = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (b.t||0) - (a.t||0)); scheduleRender(); }, onErr);
  db.doc("meta/log").onSnapshot(s => { S.log = s.exists ? (s.data().entries || []) : []; scheduleRender(); }, onErr);
  render();
})();
})();
