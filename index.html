<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Revolve Stock">
<meta name="theme-color" content="#0B0B0D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
.rr-welcome,.rr-share{position:fixed;inset:0;z-index:100;background:var(--bg,#0B0B0D);display:flex;align-items:center;justify-content:center;padding:24px;color:var(--ink,#F1EEE8);font-family:"Instrument Sans",system-ui,-apple-system,sans-serif}
.rr-share{background:rgba(0,0,0,.6)}
.rr-w-box,.rr-share-box{width:100%;max-width:380px;text-align:center}
.rr-share-box{background:var(--surface,#141417);border:1px solid var(--line,#26262B);border-radius:20px;padding:20px}
.rr-w-logo{width:200px;margin:0 auto 18px;display:block;filter:var(--logo-filter,none)}
.rr-welcome h1{font-family:"Unbounded","Arial Black",sans-serif;font-size:22px;margin:0 0 8px;letter-spacing:.04em;text-transform:uppercase}
.rr-welcome p{color:var(--muted,#8E8A84);font-size:14.5px;line-height:1.5;margin:0 0 20px}
.rr-w-err{color:var(--crit,#FF6F61)!important;margin-top:12px!important}
</style>
<script src="local-runtime.js"></script>
</head>
<body>
<title>Revolve Realm Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: dark-first boutique stockroom — wordmark header, location-split hero, 2-col product lookbook grid, floating glass tab bar, bottom sheets */
:root{
  --bg:#0B0B0D; --surface:#141417; --raised:#1C1C20; --ink:#F1EEE8; --muted:#8E8A84; --line:#26262B; --tag:#1F1F24;
  --accent:#D8C49C; --accent-ink:#17140E; --accent-soft:rgba(216,196,156,.13);
  --l2:#9AA6FF; --l3:#7ACB98; --l4:#E6B45A;
  --ok:#7ACB98; --warn:#E6B45A; --crit:#FF6F61; --scrim:rgba(0,0,0,.62); --glass:rgba(22,22,26,.74);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --blue:#6E9BFF; --pin:#3DF28B; --pin-soft:rgba(61,242,139,.55); --globe:#121216; --dot:#8A867F; --r:14px; --logo-filter:none; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F1F0ED; --surface:#FFFFFF; --raised:#FFFFFF; --ink:#131316; --muted:#6D6963; --line:#E1DFDA; --tag:#EAE8E4;
  --accent:#8C6E3A; --accent-ink:#FFFFFF; --accent-soft:rgba(140,110,58,.10);
  --l2:#4655C9; --l3:#1F7A4D; --l4:#A86300;
  --ok:#1F7A4D; --warn:#A86300; --crit:#C2322A; --scrim:rgba(14,14,16,.4); --glass:rgba(255,255,255,.8);
  --shadow:0 10px 30px rgba(20,18,14,.12); --logo-filter:invert(1); --blue:#2457D6; --pin:#0FA350; --pin-soft:rgba(15,163,80,.45); --globe:#E4E3DF; --dot:#9C978F; color-scheme:light }}
:root[data-theme="light"]{
  --bg:#F1F0ED; --surface:#FFFFFF; --raised:#FFFFFF; --ink:#131316; --muted:#6D6963; --line:#E1DFDA; --tag:#EAE8E4;
  --accent:#8C6E3A; --accent-ink:#FFFFFF; --accent-soft:rgba(140,110,58,.10);
  --l2:#4655C9; --l3:#1F7A4D; --l4:#A86300;
  --ok:#1F7A4D; --warn:#A86300; --crit:#C2322A; --scrim:rgba(14,14,16,.4); --glass:rgba(255,255,255,.8);
  --shadow:0 10px 30px rgba(20,18,14,.12); --logo-filter:invert(1); --blue:#2457D6; --pin:#0FA350; --pin-soft:rgba(15,163,80,.45); --globe:#E4E3DF; --dot:#9C978F; color-scheme:light }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
.app{max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 78%,transparent);display:flex;align-items:center;gap:12px;padding-block:16px 18px}
.logo{height:50px;width:auto;flex:none;filter:var(--logo-filter);display:block}
.brand{margin:0;flex:1;min-width:0;line-height:1;padding-left:10px;border-left:1px solid var(--line)}
.brand b{display:block;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.32em;text-transform:uppercase;white-space:nowrap}
.brand small{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--muted);margin-top:5px;text-transform:uppercase}
.brand small::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.brand small.off::before{background:var(--crit)}
.locpick{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 30px 8px 13px;font-size:12.5px;font-weight:500;max-width:46%;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}

h2.sec{font-family:var(--f-display);font-weight:600;text-transform:uppercase;font-size:11.5px;letter-spacing:.14em;margin:30px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;color:var(--ink)}
h2.sec span{font-family:var(--f-mono);font-weight:400;font-size:11px;letter-spacing:.04em;color:var(--muted);text-transform:none}

/* hero total */
.herocard{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 20px 18px;margin-top:4px}
.herocard>*{position:relative}
.herocard .wm{position:absolute;right:-28px;top:-18px;width:190px;height:auto;opacity:.045;filter:var(--logo-filter);transform:rotate(-8deg);pointer-events:none}
.herocard label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.herocard .big{font-family:var(--f-display);font-weight:800;font-size:52px;line-height:1;margin:8px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.herocard .big small{font-family:var(--f-mono);font-weight:400;font-size:13px;letter-spacing:.08em;color:var(--muted);margin-left:6px}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--tag);margin-top:16px;gap:2px}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.legend span b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.legend span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 11px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px;line-height:1.25}
.kpi.crit b{color:var(--crit)} .kpi.warn b{color:var(--warn)}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
button.row:active{background:var(--tag)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px;text-align:right;min-width:3ch}
.qty small{display:block;font-weight:400;font-size:9.5px;color:var(--muted);letter-spacing:.1em}
.thumb{width:46px;height:46px;border-radius:12px;background:var(--tag);flex:none;object-fit:cover;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;color:var(--accent);font-size:13px;overflow:hidden;letter-spacing:.04em}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.04em}

/* product grid */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{border:1px solid var(--line);background:var(--surface);border-radius:18px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0;transition:transform .15s ease}
.pcard:active{transform:scale(.98)}
.pcard .img{position:relative;aspect-ratio:4/5;max-width:100%;background:radial-gradient(120% 80% at 30% 20%,var(--raised),var(--tag));display:grid;place-items:center;overflow:hidden}
.pcard .img img{width:100%;height:100%;object-fit:cover}
.pcard .img .mono-init{font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--accent);opacity:.8;letter-spacing:.02em}
.pcard .badge{position:absolute;top:8px;right:8px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-family:var(--f-mono);font-weight:600;font-size:12px;display:flex;align-items:center;gap:5px}
.pcard .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.pcard .badge.low::before{background:var(--warn)} .pcard .badge.zero::before{background:var(--crit)}
.pcard .status{position:absolute;left:8px;bottom:8px}
.pcard .info{padding:10px 12px 12px;min-width:0}
.pcard .info .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .info .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.pill.actif{color:var(--ok)} .pill.precommande{color:var(--accent)} .pill.brouillon{color:var(--muted)} .pill.archive{color:var(--muted);opacity:.7}
.lvl-0{color:var(--crit)} .lvl-low{color:var(--warn)}

/* filters */
.toolbar{display:flex;flex-direction:column;gap:10px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:12px 18px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

/* bars */
.bar{height:5px;border-radius:3px;background:var(--tag);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:12px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--crit)}
.btn.danger.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:6;height:52px;padding:0 20px 0 16px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.fab span{font-size:24px;line-height:1;font-weight:400}

/* tab bar */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:7}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:24px;padding:5px;box-shadow:var(--shadow)}
.tabs button{border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;letter-spacing:.03em;color:var(--muted);border-radius:19px}
.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:600;background:var(--accent-soft)}
.tabs button[aria-current="page"] svg{stroke:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:93%;border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.2,1);border:1px solid var(--line);border-bottom:0}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.pcard{transition:none}}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet header{position:relative;display:flex;align-items:center;gap:10px;padding:22px 18px 14px}
.sheet header::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--line)}
.sheet header h3{flex:1;min-width:0;margin:0;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .x{border:0;background:var(--tag);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1}
.sheet .body{overflow-y:auto;padding:4px 18px calc(28px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.field .hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sizes .chip{min-width:46px}
.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.actions .btn{flex:1}

/* product detail */
.hero{display:flex;gap:14px;align-items:flex-start}
.hero .ph{width:104px;aspect-ratio:4/5;border-radius:16px;background:radial-gradient(120% 80% at 30% 20%,var(--raised),var(--tag));object-fit:cover;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--accent)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;flex:1;min-width:0}
.meta dt{color:var(--muted)} .meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:999px;overflow-x:auto;margin:20px 0 10px;scrollbar-width:none}
.seg button{flex:1 0 auto;border:0;background:none;border-radius:999px;padding:8px 12px;font-size:13px;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.vgroup{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 7px}
.vlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow .sz{font-family:var(--f-mono);font-weight:600;width:52px;flex:none}
.vrow .sp{flex:1}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--raised)}
.step button{border:0;background:none;width:40px;height:38px;font-size:20px;line-height:1}
.step button:active{background:var(--accent-soft)}
.step input{width:50px;height:38px;border:0;background:none;text-align:center;font-family:var(--f-mono);font-weight:600;font-size:16px;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)}
.dot.low{background:var(--warn)} .dot.zero{background:var(--crit)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}

.toast{position:fixed;left:50%;bottom:calc(158px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:40;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.banner{margin-top:16px;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);font-size:13.5px}
.log .row{padding:9px 14px}
.delta{font-family:var(--f-mono);font-weight:600;min-width:4ch;text-align:right}
.delta.plus{color:var(--ok)} .delta.minus{color:var(--crit)}
/* globe */
.globecard{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.gwrap{position:relative;background:var(--globe)}
.gwrap canvas{display:block;width:100%;max-width:100%;aspect-ratio:1/.95;touch-action:none;cursor:grab}
.gzoom{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gzoom button{border:0;background:none;width:40px;height:40px;font-size:20px;line-height:1;display:grid;place-items:center;border-top:1px solid var(--line)}
.gzoom button:first-child{border-top:0}
.gzoom button:active{background:var(--accent-soft)}
.gzoom svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.gmodes{position:absolute;top:12px;left:12px;display:flex;gap:2px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:3px}
.gmodes button{border:0;background:none;border-radius:999px;padding:6px 13px;font-size:12px;color:var(--muted)}
.gmodes button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.ghint{position:absolute;right:12px;bottom:10px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;color:var(--muted);pointer-events:none}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--pin);flex:none;animation:pulse 1.8s ease-out infinite}
.pulse.off{background:var(--line);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--pin-soft);opacity:1}50%{opacity:.55}100%{box-shadow:0 0 0 9px transparent;opacity:1}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.ginfo .row.sel{background:var(--accent-soft)}
.prow{padding:8px 10px 8px 14px}
.prow input{width:104px;flex:none;border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:8px 10px;text-align:right;font-family:var(--f-mono)}
.prow input:focus{border-color:var(--accent);outline:none}
.cahero .big{font-size:40px;color:var(--blue)}
.kpi.cost b{color:var(--crit)} .kpi.gain b{color:var(--ok)}
.money .ca{color:var(--blue)} .money small.gain{color:var(--ok)}
.cahero .sub{font-size:12.5px;color:var(--muted);margin-top:6px}
.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.money small{display:block;font-weight:400;font-size:10.5px;color:var(--muted)}
.money .neg{color:var(--crit)}
.fgroup{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.flabel{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cabubble{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:12px 16px;border-radius:999px;border:1px solid color-mix(in srgb,var(--blue) 35%,var(--line));background:color-mix(in srgb,var(--blue) 12%,var(--surface));text-align:left}
.cabubble .lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cabubble b{margin-left:auto;font-family:var(--f-display);font-weight:600;font-size:19px;color:var(--blue);white-space:nowrap;font-variant-numeric:tabular-nums}
.cabubble .miss{font-size:11px;color:var(--warn);white-space:nowrap}
.cabubble .go{color:var(--muted);font-size:20px;line-height:1}
@media (max-width:360px){.cabubble .miss{display:none}}
.viewseg{margin:0 0 14px}
.viewseg button{flex:1 1 0}
.seg.mini{display:inline-flex;margin:0;padding:2px;vertical-align:middle}
.seg.mini button{padding:4px 10px;font-size:11px;font-family:var(--f-body);letter-spacing:0;text-transform:none}
.sellbtn{border:1px solid color-mix(in srgb,var(--blue) 40%,var(--line));background:color-mix(in srgb,var(--blue) 12%,var(--surface));color:var(--blue);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600}
.sellbtn:active{background:color-mix(in srgb,var(--blue) 25%,var(--surface))}
.chartcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px}
.chartwrap svg{display:block;width:100%;height:auto;max-width:100%}
.chartcap{margin:2px 6px 6px;font-size:12.5px;color:var(--muted)}
.chartcap .ca{color:var(--blue);font-family:var(--f-mono)}
.rank{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--tag);color:var(--muted)}
.rank.top{background:var(--blue);color:var(--bg)}
.bar i.blue{background:var(--blue)}
.szb{width:46px;flex:none;font-weight:600}
.szchip{display:inline-flex;flex-direction:column;align-items:center;gap:1px;padding:6px 10px;min-width:52px}
.szchip span{font-size:11px;color:var(--muted)}
.szchip[aria-pressed="true"] span{color:inherit;opacity:.8}
.szchip[data-empty]{opacity:.55}
.bestrow .thumb{outline:2px solid var(--blue);outline-offset:-2px}
.kpis.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.lblw{display:flex;flex-direction:column;gap:2px;min-width:0}
.netl{font-family:var(--f-mono);font-size:11.5px;color:var(--ok);white-space:nowrap}
.invcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.invhead{display:flex;align-items:flex-start;gap:10px}
.invhead .main{flex:1;min-width:0}
.invhead .t{font-weight:600}
.invhead .s{font-size:12.5px;color:var(--muted)}
.invlines{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:5px}
.invl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;font-size:13px;align-items:baseline}
.invl span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.invfoot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px}
.invfoot b{font-size:18px}
.invcard .actions .btn{padding:10px 12px;font-size:13.5px}
.xferbtn{margin-top:8px;gap:8px}
.xferbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.trhead{font-weight:600;font-size:13px;padding:10px 14px 4px;border-top:1px solid var(--line);background:var(--surface)}
.vlist .trhead:first-child{border-top:0}
.trbar{margin:12px 0 8px;font-size:13px;color:var(--muted)}
.trbar b{color:var(--ink)}
.mebanner{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;margin-top:8px;padding:12px 16px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 12%,var(--surface));text-align:left}
.mebanner b{grid-column:1;font-size:14px}
.mebanner span:not(.go){grid-column:1;font-size:12.5px;color:var(--muted)}
.mebanner .go{grid-column:2;grid-row:1/3;align-self:center;font-size:20px;color:var(--muted)}
</style>

const GEO = (() => {
  let raw = {}; try { raw = JSON.parse(document.getElementById("geo").textContent); } catch(e){}
  const dec = b64 => {
    if (!b64) return {n:0};
    const bin = atob(b64), n = bin.length / 4, u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const dv = new DataView(u.buffer), sl = new Float32Array(n), cl = new Float32Array(n), lo = new Float32Array(n), la = new Float32Array(n);
    for (let i = 0; i < n; i++){ const a = dv.getInt16(i*4, true)/100, o = dv.getInt16(i*4+2, true)/100; la[i] = a; lo[i] = o*Math.PI/180; sl[i] = Math.sin(a*Math.PI/180); cl[i] = Math.cos(a*Math.PI/180); }
    return {n, la, lo, sl, cl};
  };
  return { coarse: dec(raw.coarse), fine: dec(raw.fine), xfine: dec(raw.xfine), fr: raw.fr || [], eu: raw.eu || [] };
})();

const G = {
  canvas:null, ctx:null, w:0, h:0, dpr:1, lat:46.5, lon:2.4, k:4.2, mode:"france", anim:true,

  reduce: matchMedia("(prefers-reduced-motion: reduce)").matches
};
const D2R = Math.PI/180;
function gTarget(){ return G.mode === "france" ? {lat:46.5, lon:2.4, k:4.2} : {lat:38, lon:G.lon, k:0.42}; }
function gColors(){

new MutationObserver(gColors).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

function gAttach(slot){
  if (G.canvas){ slot.append(G.canvas); gColors(); gResize(); if (!G.raf) G.raf = requestAnimationFrame(gLoop); return; }
  const canvas = document.createElement("canvas"); canvas.setAttribute("aria-label", "Globe des emplacements de stock"); canvas.setAttribute("role", "img");
  slot.append(canvas);
  G.canvas = canvas; G.ctx = canvas.getContext("2d"); gColors(); gResize();
  G.ro = new ResizeObserver(() => gResize()); G.ro.observe(canvas);
  const take = () => { G.anim = false; G.focus = null; G.user = true; };
  canvas.addEventListener("pointerdown", e => {
    G.ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
    if (G.ptrs.size === 2){
      const [a, b] = [...G.ptrs.values()];
      G.pinch = {d: Math.hypot(a.x-b.x, a.y-b.y) || 1, k:G.k}; G.drag = null; take();
    } else if (G.ptrs.size === 1){
      G.drag = {x:e.clientX, y:e.clientY, lat:G.lat, lon:G.lon, moved:false, id:e.pointerId, t:performance.now()};
    }
  });
  canvas.addEventListener("pointermove", e => {
    if (!G.ptrs.has(e.pointerId)) return;
    G.ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (G.pinch && G.ptrs.size >= 2){
      const [a, b] = [...G.ptrs.values()];
      G.k = gClampK(G.pinch.k * (Math.hypot(a.x-b.x, a.y-b.y) / G.pinch.d)); return;
    }
    if (!G.drag || G.drag.id !== e.pointerId) return;
    const dx = e.clientX - G.drag.x, dy = e.clientY - G.drag.y;
    if (!G.drag.moved && Math.abs(dx) + Math.abs(dy) > 4){ G.drag.moved = true; take(); }
    if (!G.drag.moved) return;
    const R = G.k * G.w;
    G.lon = G.drag.lon - dx / R / D2R / Math.max(.3, Math.cos(G.lat*D2R));
    G.lat = Math.max(-80, Math.min(80, G.drag.lat + dy / R / D2R));
  });
  const end = e => {
    G.ptrs.delete(e.pointerId);
    if (G.pinch){ if (G.ptrs.size < 2) G.pinch = null; G.drag = null; return; }
    if (!G.drag) return;
    if (!G.drag.moved && e.type === "pointerup"){
      const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, now = performance.now();
      if (G.lastTap && now - G.lastTap.t < 320 && Math.hypot(x - G.lastTap.x, y - G.lastTap.y) < 30){ gZoomAt(x, y, 2.2); G.lastTap = null; }

  canvas.addEventListener("dblclick", e => e.preventDefault());
  if (!G.raf) G.raf = requestAnimationFrame(gLoop);
}
function gResize(){
  if (!G.canvas) return;
  const r = G.canvas.getBoundingClientRect(); G.dpr = Math.min(2, devicePixelRatio || 1);
  G.w = r.width; G.h = r.height; G.canvas.width = Math.round(r.width * G.dpr); G.canvas.height = Math.round(r.height * G.dpr);
}
function gSetMode(m){ G.mode = m; G.anim = true; G.user = false; G.focus = null; }
const gClampK = k => Math.max(.32, Math.min(28, k));
function gUnproject(x, y){
  const R = G.k * G.w, px = (x - G.w/2) / R, py = -(y - G.h/2) / R, rho = Math.hypot(px, py);
  if (rho >= 1) return null; if (rho < 1e-9) return {lat:G.lat, lon:G.lon};
  const c = Math.asin(rho), sc = Math.sin(c), cc = Math.cos(c), s0 = Math.sin(G.lat*D2R), c0 = Math.cos(G.lat*D2R);
  return {lat: Math.asin(cc*s0 + py*sc*c0/rho)/D2R, lon: G.lon + Math.atan2(px*sc, rho*c0*cc - py*s0*sc)/D2R};
}
function gZoomAt(x, y, f, instant){
  const nk = gClampK(G.k * f); const g = gUnproject(x, y);
  G.anim = false; G.user = true;
  // move the centre part of the way toward the pointed spot so it stays roughly under the finger
  let lat = G.lat, lon = G.lon;
  if (g){ const t = 1 - G.k / nk; lat = G.lat + (g.lat - G.lat) * t; lon = G.lon + ((((g.lon - G.lon) + 540) % 360) - 180) * t; }
  if (instant){ G.k = nk; G.lat = Math.max(-80, Math.min(80, lat)); G.lon = lon; G.focus = null; }
  else G.focus = {lat, lon, k:nk};
}
function gZoomBtn(f){ gZoomAt(G.w/2, G.h/2, f); }
function gFocus(p){ G.sel = p.key; G.anim = false; G.user = true; G.focus = {lat:p.lat, lon:p.lng, k: Math.max(G.k, 9)}; }
function gProject(lat, lonRad, sl, cl, s0, c0, l0, R, cx, cy){
  const dl = lonRad - l0, cdl = Math.cos(dl);
  const cosc = s0*sl + c0*cl*cdl;
  return [cx + R*cl*Math.sin(dl), cy - R*(c0*sl - s0*cl*cdl), cosc];
}
function gLoop(t){
  G.raf = 0;
  if (!G.canvas || !G.canvas.isConnected) return;
  // camera
  const tg = G.focus || (G.anim ? gTarget() : null);
  if (tg && !G.drag){
    const e = G.reduce ? 1 : .09;
    let dlon = ((tg.lon - G.lon + 540) % 360) - 180;
    G.lat += (tg.lat - G.lat) * e; G.lon += dlon * e;
    G.k = Math.exp(Math.log(G.k) + (Math.log(tg.k) - Math.log(G.k)) * e);
    if (Math.abs(tg.lat - G.lat) < .005 && Math.abs(dlon) < .005 && Math.abs(tg.k - G.k) / tg.k < .002){ G.lat = tg.lat; G.lon = tg.lon; G.k = tg.k; G.focus = null; if (G.mode === "france") G.anim = false; }
  }
  if (G.mode === "monde" && !G.user && !G.drag && !G.focus && !G.reduce) G.lon += .12;
  gDraw(t);
  if (!document.hidden) G.raf = requestAnimationFrame(gLoop);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && !G.raf && G.canvas?.isConnected) G.raf = requestAnimationFrame(gLoop); });

function gDraw(t){
  const {ctx, w, h, dpr, colors:C} = G; if (!w) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const R = G.k * w, cx = w/2, cy = h/2;
  const s0 = Math.sin(G.lat*D2R), c0 = Math.cos(G.lat*D2R), l0 = G.lon*D2R;
  const close = G.k > 1.4;
  // halo + sphere
  if (!close){
    const gl = ctx.createRadialGradient(cx, cy, R*.92, cx, cy, R*1.22);
    gl.addColorStop(0, C.pin + "33"); gl.addColorStop(1, "transparent");
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(cx, cy, R*1.22, 0, 7); ctx.fill();
  }
  ctx.fillStyle = C.globe; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
  // land dots
  ctx.fillStyle = C.dot;
  const drawSet = (S, size, skipEU) => {
    for (let i = 0; i < S.n; i++){
      if (skipEU){ const a = S.la[i], o = S.lo[i]/D2R; if (a >= 34 && a <= 63 && o >= -13 && o <= 27) continue; }
      const dl = S.lo[i] - l0, cdl = Math.cos(dl), cosc = s0*S.sl[i] + c0*S.cl[i]*cdl;
      if (cosc <= 0) continue;
      const x = cx + R*S.cl[i]*Math.sin(dl), y = cy - R*(c0*S.sl[i] - s0*S.cl[i]*cdl);
      if (x < -4 || y < -4 || x > w+4 || y > h+4) continue;
      ctx.globalAlpha = (.18 + .62*cosc) * (close ? .8 : 1); const r = size;
      ctx.fillRect(x - r, y - r, r*2, r*2);
    }
  };
  if (G.k > 9){ drawSet(GEO.coarse, .9, true); drawSet(GEO.fine, 1.2, false); drawSet(GEO.xfine, Math.min(1.5, Math.max(.8, R*.00012)), false); }
  else if (close){ drawSet(GEO.coarse, .9, true); drawSet(GEO.fine, Math.min(1.4, Math.max(.7, R*.0007)), false); }
  else drawSet(GEO.coarse, Math.max(.5, R*.0042), false);
  ctx.globalAlpha = 1;
  // borders
  const path = (rings, stroke, width, fill) => {
    ctx.beginPath();
    for (const ring of rings){
      let first = true;
      for (const [lo, la] of ring){
        const [x, y, cc] = gProject(la, lo*D2R, Math.sin(la*D2R), Math.cos(la*D2R), s0, c0, l0, R, cx, cy);
        if (cc <= 0){ first = true; continue; }
        first ? ctx.moveTo(x, y) : ctx.lineTo(x, y); first = false;
      }
      ctx.closePath();
    }
    if (fill){ ctx.fillStyle = fill; ctx.fill(); }
    ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke();
  };
  if (close && G.k < 7){ ctx.globalAlpha = .35 * Math.min(1, (7 - G.k) / 3); path(GEO.eu, C.line, 1); ctx.globalAlpha = 1; }
  const fa = close ? Math.max(0, Math.min(.9, (7 - G.k) / 3)) : .7;
  if (fa > 0){ ctx.globalAlpha = fa; path(GEO.fr, C.accent, close ? 1.4 : 1, C.accent + "14"); ctx.globalAlpha = 1; }
  // markers
  const now = (t || performance.now()) / 1000; G.screen = []; const labels = [];
  const maxQ = Math.max(1, ...G.pts.map(p => p.qty));
  for (const p of G.pts){
    const [x, y, cc] = gProject(p.lat, p.lng*D2R, Math.sin(p.lat*D2R), Math.cos(p.lat*D2R), s0, c0, l0, R, cx, cy);
    if (cc <= 0 || x < -20 || y < -20 || x > w+20 || y > h+20) continue;
    G.screen.push({p, x, y});
    const base = 3.5 + 3.5*Math.sqrt(p.qty / maxQ), sel = G.sel === p.key;
    if (!G.reduce){
      for (let k = 0; k < 2; k++){
        const ph = ((now / 1.8) + p.phase + k*.5) % 1;
        ctx.globalAlpha = (1 - ph) * .55; ctx.strokeStyle = C.pin; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, base + ph*(close ? 22 : 14), 0, 7); ctx.stroke();
      }
    }
    const blink = G.reduce ? 1 : .6 + .4*(.5 + .5*Math.sin(now*4 + p.phase*6.28));
    ctx.globalAlpha = 1; ctx.shadowColor = C.pin; ctx.shadowBlur = 14*blink;
    ctx.fillStyle = C.pin; ctx.globalAlpha = blink; ctx.beginPath(); ctx.arc(x, y, base, 0, 7); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    if (sel){ ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, base + 4, 0, 7); ctx.stroke(); }
    if (G.k >= 7 || sel) labels.push({p, x, y, base});
  }
  const placed = [];
  for (const L of labels.sort((a,b)=>a.y-b.y)){
    const {p, x, y, base} = L;
    {
      const label = p.city.toUpperCase(), sub = int(p.qty) + " pcs";
      ctx.font = "600 10px 'JetBrains Mono', monospace";
      const tw = Math.max(ctx.measureText(label).width, ctx.measureText(sub).width) + 14;
      let lx = x + base + 8, ly = y - 16;
      if (lx + tw > w - 4) lx = x - base - 8 - tw;
      for (const b of placed) if (lx < b.x + b.w && lx + tw > b.x && ly < b.y + 34 && ly + 34 > b.y) ly = b.y + 36;
      placed.push({x:lx, y:ly, w:tw});
      ctx.fillStyle = C.bg; ctx.globalAlpha = .82;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(lx, ly, tw, 32, 8) : ctx.rect(lx, ly, tw, 32); ctx.fill();
      ctx.globalAlpha = 1; ctx.fillStyle = C.ink; ctx.fillText(label, lx + 7, ly + 13);
      ctx.fillStyle = C.pin; ctx.fillText(sub, lx + 7, ly + 26);
    }
  }
}
function gHit(x, y){
  let best = null, bd = 26;
  for (const s of G.screen || []){ const d = Math.hypot(s.x - x, s.y - y); if (d < bd){ bd = d; best = s.p; } }
  G.sel = best ? best.key : null;
  G.onSelect?.(best);
}

/* ---------- UI primitives ---------- */
let toastT;
function toast(msg){
  $(".toast")?.remove(); clearTimeout(toastT);
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t);
  toastT = setTimeout(()=>t.remove(), 2600);
}
let sheet = null;
function openSheet(title, renderBody, opts = {}){
  closeSheet();
  const scrim = document.createElement("div"); scrim.className = "scrim";
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h3>${esc(title)}</h3><button class="x" aria-label="Fermer">×</button></header><div class="body"></div></div>`;
  scrim.addEventListener("click", e => { if (e.target === scrim) closeSheet(); });
  $(".x", scrim).onclick = closeSheet;
  document.body.append(scrim);
  sheet = { el:scrim, body:$(".body",scrim), render:renderBody, live:!!opts.live, setTitle:t=>$("h3",scrim).textContent=t };
  renderBody(sheet.body, sheet);
  document.body.style.overflow = "hidden";
}
function closeSheet(){ if (sheet){ sheet.el.remove(); sheet = null; document.body.style.overflow = ""; } }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function armDelete(btn, label, fn){
  btn.onclick = async () => {
    if (!btn.classList.contains("armed")){ btn.classList.add("armed"); btn.textContent = label; setTimeout(()=>{ if(btn.isConnected){btn.classList.remove("armed"); btn.textContent = btn.dataset.orig;} }, 4000); return; }
    btn.disabled = true; await fn();
  };
  btn.dataset.orig = btn.textContent;
}

async function write(fn, okMsg){
  if (!S.db){ toast("Pas de connexion à la base."); return false; }
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch(e){
    if (e?.code === "unavailable"){ await new Promise(r=>setTimeout(r, 400+Math.random()*600)); try{ await fn(); if(okMsg) toast(okMsg); return true; }catch(e2){ e = e2; } }
    if (e?.code === "invalid_argument"){ S.canWrite = false; toast("Lecture seule : tu n'as pas les droits de modification."); }
    else if (e?.code === "quota_exceeded") toast("Base pleine : supprime des éléments archivés.");
    else toast("Enregistrement impossible, réessaie dans un instant.");
    console.error(e); return false;
  }
}

function scheduleRender(){ if (rq) return; rq = requestAnimationFrame(()=>{ rq = 0; render(); if (sheet?.live && !(sheet.el.contains(document.activeElement) && document.activeElement.matches("input"))){ const st = sheet.body.scrollTop; sheet.render(sheet.body, sheet); sheet.body.scrollTop = st; } }); }

function renderLocFilter(){
  const sel = $("#locFilter"); const cur = S.loc;
  const key = locs().map(l=>l.id+":"+l.name).join("|");
  if (sel.dataset.key !== key){ sel.dataset.key = key; sel.innerHTML = `<option value="all">Partout</option>` + locs().map(l=>`<option value="${esc(l.id)}">${esc(l.name)}</option>`).join(""); }
  sel.value = S.locations.has(cur) || cur === "all" ? cur : "all"; S.loc = sel.value;
}
$("#locFilter").onchange = e => { S.loc = e.target.value; scheduleRender(); };

function render(){
  renderLocFilter();
  $$(".tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  $("#fab").hidden = !(S.tab === "produits" && S.db && S.canWrite);
  $("#locFilter").hidden = S.tab === "chiffres" || S.tab === "reglages";

  if (!S.db && S.ready){ v.innerHTML = `<div class="banner" style="margin-top:20px"><b>Stockage indisponible.</b><br>Safari n'a pas pu ouvrir le stockage de l'appli (navigation privée ?). Rouvre l'appli depuis l'écran d'accueil pour accéder à ton stock.</div>`; return; }
  (({apercu:viewOverview, produits:viewProducts, collections:viewCollections, chiffres:viewChiffres, reglages:viewSettings})[S.tab] || viewOverview)(v);
}

function viewOverview(v){

function backupBanner(){

function monthEndBanner(){
  const d = new Date(), day = d.getDate(), last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  if (!(day >= last - 3 || day <= 7)) return "";
  const mk = day <= 7 ? monthKey(new Date(d.getFullYear(), d.getMonth() - 1, 15).getTime()) : monthKey(d.getTime());
  const ids = [...new Set(S.sales.filter(x => isGimsSale(x) && monthKey(x.t) === mk).map(x => x.locId))].filter(id => !S.invoices.some(i => i.id === mk + "_" + id));
  if (!ids.length) return "";
  const amt = ids.reduce((s, id) => s + invoiceData(mk, id).due, 0);
  return `<button class="mebanner" id="meb" data-mk="${mk}"><b>Factures GIMS de ${esc(monthLabel(mk))}</b><span>${ids.length} magasin${ids.length > 1 ? "s" : ""} à facturer · ${eur(amt)}</span><span class="go">›</span></button>`;
}

function rel(t){
  const d = (Date.now()-t)/1000;
  if (d < 60) return "à l'instant"; if (d < 3600) return Math.floor(d/60)+" min";
  if (d < 86400) return Math.floor(d/3600)+" h";
  return new Date(t).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
}

function setQty(pid, vid, loc, n){
  const p = S.products.get(pid); if (!p) return;
  S.pendingBase[pid] ||= {}; S.pendingBase[pid][vid] ||= {};
  if (S.pendingBase[pid][vid][loc] == null) S.pendingBase[pid][vid][loc] = Number(p.stock?.[vid]?.[loc] ?? 0);
  S.pending[pid] ||= {}; S.pending[pid][vid] ||= {}; S.pending[pid][vid][loc] = n;
  S.ver[pid] = (S.ver[pid]||0) + 1;
  clearTimeout(S.timers[pid]);
  S.timers[pid] = setTimeout(() => flush(pid), 700);
  $("#syncState").textContent = "enregistrement…";
}
function flush(pid){
  const chain = (S.chains[pid] || Promise.resolve()).then(async () => {
    if (!S.pending[pid]) return;
    const ver = S.ver[pid];
    const pend = JSON.parse(JSON.stringify(S.pending[pid])), base = JSON.parse(JSON.stringify(S.pendingBase[pid] || {}));
    const p = S.products.get(pid); if (!p){ delete S.pending[pid]; delete S.pendingBase[pid]; return; }
    const stock = {}; const entries = [];
    for (const [vid, byLoc] of Object.entries(pend)){
      for (const [loc, n] of Object.entries(byLoc)){
        (stock[vid] ||= {})[loc] = n;
        const d = n - (base?.[vid]?.[loc] ?? 0);
        const vr = (p.variants||[]).find(x=>x.id===vid);
        if (d) entries.push({t:Date.now(), product:p.name, variant:vr?vlabel(vr):vid, loc:S.locations.get(loc)?.name||loc, d});
      }
    }
    const ok = await write(() => S.db.doc("products/"+pid).update({stock, updatedAt:Date.now()}));
    if (!ok || S.ver[pid] === ver){
      // nothing changed since: drop the optimistic layer (on failure, fall back to the stored values)
      delete S.pending[pid]; delete S.pendingBase[pid];
    } else {
      // newer taps are waiting: their movement starts from what was just saved
      for (const [vid, byLoc] of Object.entries(pend)) for (const [loc, n] of Object.entries(byLoc))
        if (S.pendingBase[pid]?.[vid]) S.pendingBase[pid][vid][loc] = n;
    }
    if (ok && entries.length) await appendLog(entries);
    $("#syncState").textContent = ok ? "à jour" : "erreur d'enregistrement";

function allSizesOrder(list){
  const ref = Object.values(PRESETS).flat();
  return [...list].sort((a,b)=>{ const ia=ref.indexOf(a), ib=ref.indexOf(b);
    if (ia>-1 && ib>-1) return ia-ib; const na=parseFloat(a), nb=parseFloat(b);
    if (!isNaN(na) && !isNaN(nb)) return na-nb; if (ia>-1) return -1; if (ib>-1) return 1; return a.localeCompare(b); });
}
function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const m = 1200, k = Math.min(1, m/Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("encode")), "image/jpeg", .84); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("read")); };
    img.src = url;
  });
}

function scopeLocs(sc){

  const scopes = [["all","Partout"],["me","Moi"],["gims","GIMS (tous)"], ...locs().map(l => [l.id, l.name])];

      ${kpi(eur(net), "Ma part (ce que je touche)", "gain")}

    ${L.length > 1 ? `<h2 class="sec">Par emplacement <span>CA · ma part · marge</span></h2>
    <div class="list">${locRows.length ? locRows.map(x => `<button class="row" data-sc="${esc(x.l.id)}"><span class="main"><div class="t">${esc(x.l.name)}</div><div class="s">${int(x.pcs)} pcs</div><div class="bar"><i style="width:${Math.round(x.ca/maxL*100)}%"></i></div></span><span class="money"><span class="ca">${eur(x.ca)}</span><small class="gain">ma part ${eur(x.net)}</small><small class="${x.margin<0?"neg":"gain"}">marge ${eur(x.margin)}</small></span></button>`).join("") : `<div class="empty">Aucun stock pour ce filtre.</div>`}</div>` : ""}
    <h2 class="sec">Par produit <span>${byProd.length}</span></h2>

async function doTransfer(from, to, cart, opts = {}){
  const byP = {};
  for (const [k, n] of Object.entries(cart)){ if (!n) continue; const [pid, vid] = k.split("|"); (byP[pid] ||= {})[vid] = n; }
  const items = [];
  for (const [pid, vids] of Object.entries(byP)){
    const p = S.products.get(pid); if (!p) continue;
    clearTimeout(S.timers[pid]); if (S.pending[pid]) flush(pid); await (S.chains[pid] || Promise.resolve());
    const cur = S.products.get(pid) || p, stock = {};
    for (const [vid, n0] of Object.entries(vids)){
      const have = q(cur, vid, from), n = opts.force ? n0 : Math.min(n0, have);
      if (n <= 0) continue;
      (stock[vid] ||= {})[from] = Math.max(0, have - n);
      stock[vid][to] = q(cur, vid, to) + n;
      const vr = (p.variants || []).find(v => v.id === vid);
      items.push({productId:pid, name:p.name, vid, label:vr ? vlabel(vr) : vid, qty:n});
    }
    if (!Object.keys(stock).length) continue;
    const ok = await write(() => S.db.doc("products/" + pid).update({stock, updatedAt:Date.now()}));
    if (!ok) return false;
  }
  if (!items.length){ toast("Rien à transférer."); return false; }
  const fromName = S.locations.get(from)?.name || "", toName = S.locations.get(to)?.name || "";
  const total = items.reduce((s, x) => s + x.qty, 0);
  if (!opts.noRecord) await write(() => S.db.collection("transfers").add({t:Date.now(), from, to, fromName, toName, items, total}));
  appendLog([{t:Date.now(), product: items.length === 1 ? items[0].name : `${items.length} articles`, variant:`${opts.undo ? "transfert annulé" : "transfert"} → ${toName}`, loc:fromName, d:-total}]);
  return true;
}

function transferHistory(body, sh, back){
  const list = S.transfers.slice(0, 40);
  body.innerHTML = `
    <div class="actions" style="margin:0 0 12px"><button class="btn" id="t-back" style="flex:0 0 auto">← Nouveau transfert</button></div>
    <div class="list">${list.length ? list.map(t => `<button class="row" data-tr="${esc(t.id)}"><span class="main"><div class="t">${esc(S.locations.get(t.from)?.name || t.fromName)} → ${esc(S.locations.get(t.to)?.name || t.toName)}</div><div class="s">${esc(fmtDateY(t.t))} · ${(t.items || []).map(x => esc(x.name.split(" ")[0]) + " " + esc(x.label) + " ×" + x.qty).slice(0, 3).join(", ")}${(t.items || []).length > 3 ? "…" : ""}</div></span><span class="qty">${int(t.total)}<small>PCS</small></span></button>`).join("") : `<div class="empty">Aucun transfert pour l'instant.</div>`}</div>`;
  $("#t-back").onclick = back;
  $$("[data-tr]", body).forEach(b => b.onclick = () => {
    const t = S.transfers.find(x => x.id === b.dataset.tr); if (!t) return;
    body.innerHTML = `
      <div class="actions" style="margin:0 0 12px"><button class="btn" id="t-back2" style="flex:0 0 auto">← Historique</button></div>
      <p style="margin:0 0 6px"><b>${esc(S.locations.get(t.from)?.name || t.fromName)} → ${esc(S.locations.get(t.to)?.name || t.toName)}</b></p>
      <p class="note" style="margin:0 0 10px">${esc(fmtDateY(t.t))} · ${int(t.total)} pièce${t.total > 1 ? "s" : ""}</p>
      <div class="list">${(t.items || []).map(x => `<div class="row"><span class="main"><div class="t">${esc(x.name)}</div><div class="s">${esc(x.label)}</div></span><span class="qty">${int(x.qty)}</span></div>`).join("")}</div>
      ${S.canWrite ? `<div class="actions" style="margin-top:16px"><button class="btn danger" id="t-undo">Annuler ce transfert</button></div><p class="note">Remet les pièces à leur emplacement d'origine (dans la limite de ce qui reste à l'arrivée).</p>` : ""}`;
    $("#t-back2").onclick = () => transferHistory(body, sh, back);
    $("#t-undo") && armDelete($("#t-undo"), "Toucher encore pour annuler", async () => {
      const cart = {}; (t.items || []).forEach(x => cart[x.productId + "|" + x.vid] = (cart[x.productId + "|" + x.vid] || 0) + x.qty);
      const ok = await doTransfer(t.to, t.from, cart, {noRecord:true, undo:true});
      if (ok){ await write(() => S.db.doc("transfers/" + t.id).delete(), "Transfert annulé"); }
      closeSheet();
    });
  });
}

function chBind(v){
  const F = S.ca;
  $$("[data-cv]", v).forEach(b => b.onclick = () => { F.view = b.dataset.cv; F.selB = null; render(); });
  $$("[data-sc]", v).forEach(b => b.onclick = () => { F.scope = b.dataset.sc; F.selB = null; window.scrollTo(0,0); render(); });
  $$("[data-cc]", v).forEach(b => b.onclick = () => { F.col = b.dataset.cc; F.selB = null; render(); });
  $$("[data-pp]", v).forEach(b => b.onclick = () => { F.period = b.dataset.pp; F.selB = null; render(); });
  $$("[data-open]", v).forEach(b => b.onclick = () => openProduct(b.dataset.open));
}

/* ---------- Ventes ---------- */
const DAY = 864e5;
const fmtDate = t => new Date(t).toLocaleDateString("fr-FR", {day:"numeric", month:"short"});
const fmtDateY = t => new Date(t).toLocaleDateString("fr-FR", {day:"numeric", month:"short", year:"numeric"});
function weekStart(t){ const d = new Date(t); d.setHours(0,0,0,0); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return d.getTime(); }
function monthStart(t){ const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); }
const saleColId = x => x.collectionId ?? S.products.get(x.productId)?.collectionId ?? null;

function filteredSales(withPeriod = true){
  const F = S.ca;
  const L = new Set(scopeLocs(F.scope).map(l => l.id));
  const from = F.period === "all" || !withPeriod ? 0 : Date.now() - Number(F.period) * DAY;
  return S.sales.filter(x => (F.scope === "all" || L.has(x.locId)) && (F.col === "all" || saleColId(x) === F.col) && (x.t||0) >= from);
}
function saleTotals(list){
  let ca = 0, net = 0, cost = 0, margin = 0, pcs = 0, noCost = 0;
  for (const x of list){
    const q = x.qty || 0, pr = num(x.unitPrice) ?? 0, c = num(x.unitCost);
    const nt = isGimsSale(x) && consignSet(x) ? saleDue(x) : q * pr;
    pcs += q; ca += q * pr; net += nt;
    if (c === null) noCost += q; else { cost += q * c; margin += nt - q * c; }
  }
  return {ca, net, cost, margin, pcs, noCost};
}

function viewVentes(v){
  const F = S.ca;
  if (F.scope !== "all" && F.scope !== "me" && F.scope !== "gims" && !S.locations.has(F.scope)) F.scope = "all";
  if (F.col !== "all" && !S.collections.has(F.col)) F.col = "all";
  const list = filteredSales();
  const T = saleTotals(list);
  const scopeName = F.scope === "all" ? "partout" : F.scope === "me" ? "chez moi" : F.scope === "gims" ? "tous les magasins GIMS" : (S.locations.get(F.scope)?.name || "");
  const periodName = {"30":"30 derniers jours","90":"3 derniers mois","180":"6 derniers mois","365":"12 derniers mois","all":"depuis le début"}[F.period];
  // buckets
  const now = Date.now();
  const startT = F.period === "all" ? Math.min(now, ...list.map(x => x.t||now)) : now - Number(F.period) * DAY;
  const gran = F.gran;
  const bstart = gran === "week" ? weekStart : monthStart;
  const buckets = [];
  for (let t = bstart(startT); t <= now; ){
    buckets.push({t, ca:0, pcs:0});
    if (gran === "week") t += 7*DAY; else { const d = new Date(t); t = new Date(d.getFullYear(), d.getMonth()+1, 1).getTime(); }
  }
  const bIndex = new Map(buckets.map((b,i) => [b.t, i]));
  for (const x of list){ const i = bIndex.get(bstart(x.t)); if (i != null){ buckets[i].ca += (x.qty||0) * (num(x.unitPrice)??0); buckets[i].pcs += x.qty||0; } }
  // rankings
  const byLoc = new Map(), bySize = new Map(), byProd = new Map();
  for (const x of list){
    const q = x.qty||0, amt = q * (num(x.unitPrice)??0);
    const l = byLoc.get(x.locId) || {id:x.locId, name: S.locations.get(x.locId)?.name || x.locName || "?", pcs:0, ca:0}; l.pcs += q; l.ca += amt; byLoc.set(x.locId, l);
    const sz = x.size || "TU"; const s0 = bySize.get(sz) || {size:sz, pcs:0}; s0.pcs += q; bySize.set(sz, s0);
  }
  const ms = monthStart(now);
  for (const x of filteredSales(false).filter(x => (x.t||0) >= ms)){
    const q = x.qty||0; const r = byProd.get(x.productId) || {id:x.productId, name: S.products.get(x.productId)?.name || x.productName, pcs:0, ca:0}; r.pcs += q; r.ca += q * (num(x.unitPrice)??0); byProd.set(x.productId, r);
  }
  const locRank = [...byLoc.values()].sort((a,b) => b.ca - a.ca || b.pcs - a.pcs);
  const ref = [...Object.values(PRESETS).flat()];
  const sizeRank = [...bySize.values()].sort((a,b) => b.pcs - a.pcs || ref.indexOf(a.size) - ref.indexOf(b.size));
  const best = [...byProd.values()].sort((a,b) => b.pcs - a.pcs || b.ca - a.ca)[0];
  const maxLoc = Math.max(1, ...locRank.map(x => x.ca)), maxSz = Math.max(1, ...sizeRank.map(x => x.pcs));
  const monthName = new Date().toLocaleDateString("fr-FR", {month:"long"});
  const bestP = best ? S.products.get(best.id) : null;

  v.innerHTML = `${chHeader()}
    <section class="herocard cahero" style="margin-top:16px">
      <label>CA réalisé · ${esc(scopeName)}</label>
      <div class="big">${eur(T.ca)}</div>
      <div class="sub">${int(T.pcs)} pièce${T.pcs>1?"s":""} vendue${T.pcs>1?"s":""} · ${esc(periodName)}</div>
    </section>
    <div class="kpis k2">
      ${kpi(eur(T.ca - T.net), "Commission GIMS", "cost")}
      ${kpi(eur(T.net), "Ma part (encaissée ou due)", "gain")}
      ${kpi(T.noCost === T.pcs && T.pcs ? "—" : eur(T.cost), "Coût fournisseur", "cost")}
      ${kpi(eur(T.margin), "Marge nette" + (T.net ? " · " + Math.round(T.margin / T.net * 100) + " %" : ""), T.margin < 0 ? "crit" : "gain")}
    </div>
    ${S.canWrite ? `<button class="btn primary block" id="newsale" style="margin-top:10px">Enregistrer une vente</button>` : ""}
    <h2 class="sec">Évolution du CA <span><span class="seg mini" role="group" aria-label="Regrouper"><button data-gr="week" aria-pressed="${gran==="week"}">Semaine</button><button data-gr="month" aria-pressed="${gran==="month"}">Mois</button></span></span></h2>
    <section class="chartcard">${list.length ? salesChart(buckets, gran) : `<div class="empty"><b>Pas encore de vente</b>Touche « Vendu » sur une taille dans la fiche d'un produit, ou le bouton ci-dessus.</div>`}</section>
    <h2 class="sec">Meilleur produit · ${esc(monthName)}</h2>
    <div class="list">${best ? `<button class="row bestrow" data-open="${esc(best.id)}">
      ${bestP?.photo ? `<img class="thumb" src="${esc(imgSrc(bestP.photo))}" alt="">` : `<span class="thumb">${esc(initials(best.name))}</span>`}
      <span class="main"><div class="t">${esc(best.name)}</div><div class="s">${int(best.pcs)} vendu${best.pcs>1?"s":""} ce mois-ci</div></span>
      <span class="money"><span class="ca">${eur(best.ca)}</span></span></button>` : `<div class="empty">Aucune vente ce mois-ci pour ce filtre.</div>`}</div>
    ${locRank.length > 1 || (F.scope !== "all" && scopeLocs(F.scope).length > 1) || F.scope === "all" ? `<h2 class="sec">Classement des emplacements <span>CA réalisé</span></h2>
    <div class="list">${locRank.length ? locRank.map((x, i) => `<button class="row" data-sc="${esc(x.id)}"><span class="rank ${i===0?"top":""}">${i+1}</span><span class="main"><div class="t">${esc(x.name)}</div><div class="s">${int(x.pcs)} pcs</div><div class="bar"><i class="blue" style="width:${Math.round(x.ca/maxLoc*100)}%"></i></div></span><span class="money"><span class="ca">${eur(x.ca)}</span></span></button>`).join("") : `<div class="empty">Aucune vente sur la période.</div>`}</div>` : ""}
    <h2 class="sec">Tailles qui partent le plus <span>pièces vendues</span></h2>
    <div class="list">${sizeRank.length ? sizeRank.map(x => `<div class="row"><span class="szb mono">${esc(x.size)}</span><span class="main"><div class="bar" style="margin-top:0"><i style="width:${Math.round(x.pcs/maxSz*100)}%"></i></div></span><span class="qty">${int(x.pcs)}</span></div>`).join("") : `<div class="empty">Aucune vente sur la période.</div>`}</div>
    <h2 class="sec">Historique <span>${list.length} vente${list.length>1?"s":""}</span></h2>
    <div class="list">${list.length ? list.slice(0, 60).map(x => `<button class="row" data-sale="${esc(x.id)}">
      <span class="main"><div class="t">${esc(S.products.get(x.productId)?.name || x.productName)}</div><div class="s">${esc([x.color, x.size].filter(Boolean).join(" · "))}${x.qty>1?` · ×${x.qty}`:""} · ${esc(S.locations.get(x.locId)?.name || x.locName || "")} · ${esc(fmtDate(x.t))}</div></span>
      <span class="money"><span class="ca">${eur((x.qty||0) * (num(x.unitPrice)??0))}</span></span></button>`).join("") : `<div class="empty">Les ventes enregistrées apparaîtront ici.</div>`}</div>`;
  chBind(v);
  $$("[data-gr]", v).forEach(b => b.onclick = () => { F.gran = b.dataset.gr; F.selB = null; render(); });
  $$("[data-sale]", v).forEach(b => b.onclick = () => openSaleDetail(b.dataset.sale));
  $("#newsale", v) && ($("#newsale", v).onclick = () => openSale({loc: !["all","me","gims"].includes(F.scope) ? F.scope : null}));
  $$("[data-bk]", v).forEach(b => b.onclick = () => { F.selB = Number(b.dataset.bk); render(); });
}

function niceMax(m){ if (m <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(m))); for (const k of [1, 2, 2.5, 5, 10]) if (k*p >= m) return k*p; return 10*p; }
function salesChart(buckets, gran){
  const F = S.ca;
  const W = 360, H = 190, pl = 44, pr = 6, pt = 10, pb = 24;
  const max = niceMax(Math.max(...buckets.map(b => b.ca)));
  const n = buckets.length, cw = (W - pl - pr) / n, bw = Math.max(1.5, Math.min(24, cw * .66));
  const y = val => pt + (H - pt - pb) * (1 - val / max);
  const sel = F.selB != null && F.selB < n ? F.selB : n - 1;
  const ticks = [0, max/2, max];
  const every = Math.ceil(n / 5);
  const lab = t => gran === "week" ? new Date(t).toLocaleDateString("fr-FR", {day:"2-digit", month:"2-digit"}) : new Date(t).toLocaleDateString("fr-FR", {month:"short"});
  const cur = buckets[sel];
  const caption = cur ? `${gran === "week" ? "Semaine du " + fmtDate(cur.t) : new Date(cur.t).toLocaleDateString("fr-FR", {month:"long", year:"numeric"})} : <b class="ca">${eur(cur.ca)}</b> · ${int(cur.pcs)} pcs` : "";
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="CA réalisé par ${gran === "week" ? "semaine" : "mois"}">
    ${ticks.map(tk => `<line x1="${pl}" x2="${W-pr}" y1="${y(tk)}" y2="${y(tk)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(tk)+4}" text-anchor="end" fill="var(--muted)" font-size="11" font-family="JetBrains Mono, monospace">${tk >= 1000 ? (tk/1000).toLocaleString("fr-FR") + " k€" : Math.round(tk) + " €"}</text>`).join("")}
    ${buckets.map((b, i) => { const x = pl + cw*i + (cw - bw)/2, h = Math.max(b.ca ? 2 : 0, (H - pt - pb) * b.ca / max);
      return `<g data-bk="${i}" style="cursor:pointer"><rect x="${pl + cw*i}" y="${pt}" width="${cw}" height="${H-pt-pb}" fill="transparent"/><rect x="${x}" y="${H - pb - h}" width="${bw}" height="${h}" rx="${Math.min(4, bw/3)}" fill="var(--blue)" opacity="${i === sel ? 1 : .55}"/>${i % every === (n-1) % every ? `<text x="${pl + cw*i + cw/2}" y="${H - 6}" text-anchor="middle" fill="var(--muted)" font-size="10" font-family="JetBrains Mono, monospace">${lab(b.t)}</text>` : ""}</g>`; }).join("")}
  </svg></div><p class="chartcap">${caption}</p>`;
}

/* enregistrer une vente */
function openSale(o = {}){
  const live1 = prods().filter(p => live(p) && (p.variants||[]).length);
  if (!live1.length){ toast("Ajoute d'abord un produit."); return; }
  if (!locs().length){ toast("Ajoute d'abord un emplacement dans Réglages."); return; }
  const st = {pid: o.pid && S.products.has(o.pid) ? o.pid : live1[0].id, color:null, vid:o.vid || null, loc:o.loc || null, qty:1, price:null, priceEdited:false, date:new Date().toISOString().slice(0,10)};
  const fix = () => {
    const p = S.products.get(st.pid);
    const vs = p.variants || [];
    if (st.vid && !vs.some(v => v.id === st.vid)) st.vid = null;
    if (st.vid) st.color = vs.find(v => v.id === st.vid).color || "";
    const colorsL = [...new Set(vs.map(v => v.color || ""))];
    if (st.color == null || !colorsL.includes(st.color)) st.color = colorsL[0];
    if (!st.loc || !S.locations.has(st.loc)){
      // the location that holds the most of this product
      st.loc = locs().map(l => [l.id, qp(p, l.id)]).sort((a,b) => b[1]-a[1])[0][0];
    }
    if (!st.vid){ const inStock = vs.find(v => (v.color||"") === st.color && q(p, v.id, st.loc) > 0); st.vid = (inStock || vs.find(v => (v.color||"") === st.color)).id; }
    if (!st.priceEdited) st.price = priceAt(p, st.loc);
    return {p, colorsL};
  };
  openSheet("Enregistrer une vente", (body, sh) => {
    const {p, colorsL} = fix();
    const vsC = (p.variants||[]).filter(v => (v.color||"") === st.color);
    const have = q(p, st.vid, st.loc);
    const total = (num(st.price) ?? 0) * st.qty;
    body.innerHTML = `
      <div class="field"><label for="s-prod">Produit</label><select id="s-prod">${live1.map(x => `<option value="${esc(x.id)}" ${x.id===st.pid?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>
      ${colorsL.length > 1 || colorsL[0] ? `<div class="field"><label>Couleur</label><div class="sizes">${colorsL.map(c => `<button type="button" class="chip" data-sco="${esc(c)}" aria-pressed="${c===st.color}">${esc(c || "Unique")}</button>`).join("")}</div></div>` : ""}
      <div class="field"><label>Emplacement</label><div class="sizes">${locs().map(l => `<button type="button" class="chip" data-slo="${esc(l.id)}" aria-pressed="${l.id===st.loc}">${esc(l.name)} <span class="muted mono">${int(q(p, st.vid, l.id))}</span></button>`).join("")}</div></div>
      <div class="field"><label>Taille</label><div class="sizes">${vsC.map(v => { const n = q(p, v.id, st.loc); return `<button type="button" class="chip szchip" data-svi="${esc(v.id)}" aria-pressed="${v.id===st.vid}" ${n<=0?"data-empty":""}><b class="mono">${esc(v.size || "TU")}</b><span class="mono">${int(n)}</span></button>`; }).join("")}</div>
        ${have <= 0 ? `<span class="hint" style="color:var(--warn)">Plus de stock pour cette taille ici : la vente sera enregistrée mais le stock reste à 0.</span>` : ""}</div>
      <div class="grid2">
        <div class="field"><label>Quantité</label><div class="step" style="align-self:flex-start"><button type="button" data-sq="-1" aria-label="Moins">−</button><input id="s-qty" type="number" inputmode="numeric" min="1" value="${st.qty}"><button type="button" data-sq="1" aria-label="Plus">+</button></div></div>
        <div class="field"><label for="s-price">Prix unitaire €</label><input id="s-price" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(st.price ?? "")}" placeholder="Prix"></div>
      </div>
      <div class="field"><label for="s-date">Date</label><input id="s-date" type="date" value="${esc(st.date)}" max="${new Date().toISOString().slice(0,10)}"></div>
      ${commOn(st.loc) && total ? `<p class="note" style="margin-top:-4px">GIMS garde ${eur(total - netAt(st.loc, st.qty, num(st.price)))} de commission · <b style="color:var(--ok)">je touche ${eur(netAt(st.loc, st.qty, num(st.price)))}</b></p>` : ""}
      <button class="btn primary block" id="s-save">Vendu${total ? " · " + eur(total) : ""}</button>
      ${num(st.price) === null ? `<p class="note">Pas de prix pour cet emplacement : indique le prix de vente pour qu'il compte dans ton CA.</p>` : ""}`;
    const re = () => sh.render(body, sh);
    $("#s-prod").onchange = e => { st.pid = e.target.value; st.vid = null; st.color = null; st.priceEdited = false; re(); };
    $$("[data-sco]", body).forEach(b => b.onclick = () => { st.color = b.dataset.sco; st.vid = null; re(); });
    $$("[data-slo]", body).forEach(b => b.onclick = () => { st.loc = b.dataset.slo; re(); });
    $$("[data-svi]", body).forEach(b => b.onclick = () => { st.vid = b.dataset.svi; re(); });
    $$("[data-sq]", body).forEach(b => b.onclick = () => { st.qty = Math.max(1, st.qty + Number(b.dataset.sq)); re(); });
    $("#s-qty").onchange = e => { st.qty = Math.max(1, Math.floor(Number(e.target.value) || 1)); re(); };
    $("#s-price").oninput = e => { st.price = e.target.value; st.priceEdited = true; const t = (num(st.price) ?? 0) * st.qty; $("#s-save").textContent = "Vendu" + (t ? " · " + eur(t) : ""); };
    $("#s-date").onchange = e => { st.date = e.target.value || st.date; };
    $("#s-save").onclick = async () => {
      const btn = $("#s-save"); btn.disabled = true; btn.textContent = "Enregistrement…";
      const ok = await recordSale(p, st);
      if (ok){ closeSheet(); toast(`Vente enregistrée${num(st.price) ? " · " + eur(num(st.price) * st.qty) : ""}`); }
      else { btn.disabled = false; btn.textContent = "Réessayer"; }
    };
  });
}
async function recordSale(p, st){
  const vr = (p.variants||[]).find(v => v.id === st.vid); const loc = S.locations.get(st.loc);
  if (!vr || !loc) return false;
  const today = new Date().toISOString().slice(0,10);
  const t = st.date === today ? Date.now() : new Date(st.date + "T12:00:00").getTime();
  // wait for any pending stock edit on this product, then read the current value
  clearTimeout(S.timers[p.id]); if (S.pending[p.id]) flush(p.id); await (S.chains[p.id] || Promise.resolve());
  const cur = q(S.products.get(p.id) || p, vr.id, st.loc);
  const next = Math.max(0, cur - st.qty);
  const sale = {t, productId:p.id, productName:p.name, collectionId:p.collectionId || null, vid:vr.id, color:vr.color || "", size:vr.size || "TU", locId:st.loc, locName:loc.name, qty:st.qty, unitPrice:num(st.price), unitCost:num(p.cost), createdAt:Date.now()};
  if (isGims(loc) && consignSet()){ const c = S.settings.consign; sale.consignMode = c.mode; sale.consignValue = Number(c.value); sale.due = dueCalc(sale); }
  const ok = await write(() => S.db.collection("sales").add(sale));
  if (!ok) return false;
  await write(() => S.db.doc("products/"+p.id).update({stock:{[vr.id]:{[st.loc]:next}}, updatedAt:Date.now()}));
  if (cur - next) appendLog([{t:Date.now(), product:p.name, variant:vlabel(vr) + " · vente", loc:loc.name, d:-(cur - next)}]);
  return true;
}

/* ---------- À recevoir de GIMS ---------- */
const isGimsSale = x => { const l = S.locations.get(x.locId); return l ? isGims(l) : /get in my shoes|gims/i.test(x.locName || ""); };
const isGimsId = id => { const l = S.locations.get(id); return !!l && isGims(l); };
const consignSet = x => (x && x.consignMode) ? true : !!(S.settings.consign && num(S.settings.consign.value) !== null);
function dueCalc(x){
  const mode = x.consignMode || S.settings.consign?.mode, v = num(x.consignMode ? x.consignValue : S.settings.consign?.value);
  const pr = num(x.unitPrice), q = x.qty || 0;
  if (pr === null || v === null) return 0;
  const each = mode === "fixed" ? pr - v : pr * (1 - v / 100);
  return Math.max(0, Math.round(each * q * 100) / 100);
}
const saleDue = x => num(x.due) ?? dueCalc(x);
const consignLabel = c => !c || num(c.value) === null ? "non définie" : c.mode === "fixed" ? `${eur(c.value)} par pièce` : `${String(c.value).replace(".", ",")} % du prix de vente`;

const monthKey = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
const monthLabel = k => { const [y, m] = k.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("fr-FR", {month:"long", year:"numeric"}); };
const INV_STATUS = {facturee:"Facturée", payee:"Payée"};

function invoiceData(mk, locId){
  const sales = S.sales.filter(x => isGimsSale(x) && monthKey(x.t) === mk && (!locId || x.locId === locId));
  const lines = new Map();
  let gross = 0, due = 0, pcs = 0, noPrice = 0;
  for (const x of sales){
    const q = x.qty || 0, pr = num(x.unitPrice), d = saleDue(x), g = pr === null ? 0 : q * pr;
    if (pr === null) noPrice += q;
    pcs += q; gross += g; due += d;
    const name = S.products.get(x.productId)?.name || x.productName;
    const k = x.productId + "|" + (pr ?? "");
    const l = lines.get(k) || {name, pu:pr, qty:0, gross:0, due:0}; l.qty += q; l.gross += g; l.due += d; lines.set(k, l);
  }
  const r2 = n => Math.round(n * 100) / 100;
  return {sales, pcs, noPrice, gross:r2(gross), due:r2(due), comm:r2(gross - due), stores:[],
    lines:[...lines.values()].sort((a,b) => a.name.localeCompare(b.name) || (b.pu||0) - (a.pu||0))};
}
const invId = (mk, locId) => mk + "_" + locId;
const billingOf = l => l?.billing || {};

async function issueInvoice(mk, locId, D, inv){
  const info = S.settings.invoice || {};
  let number = inv?.number;
  if (!number){
    const y = mk.slice(0, 4), pre = (info.prefix || "RR") + "-" + y + "-";
    const seq = Math.max(0, ...S.invoices.filter(i => String(i.number || "").startsWith(pre)).map(i => parseInt(String(i.number).slice(pre.length), 10) || 0)) + 1;
    number = pre + String(seq).padStart(3, "0");
  }
  const issuedAt = inv?.issuedAt || Date.now();
  const l = S.locations.get(locId);
  const blob = await invoicePdf(mk, l, D, number, issuedAt);
  const rec = {month:mk, locId, locName:l?.name || "", number, amount:D.due, gross:D.gross, commission:D.comm, pcs:D.pcs, issuedAt, updatedAt:Date.now()};
  const id = invId(mk, locId);
  const ok = inv ? await write(() => S.db.doc("invoices/" + id).update(rec)) : await write(() => S.db.doc("invoices/" + id).set({...rec, status:"facturee", paidAt:null}));
  if (!ok) return;
  if (!S.downloads){ toast("Facture enregistrée, mais le téléchargement n'est pas disponible ici."); return; }
  const safe = String(l?.name || "").replace(/[^\p{L}\p{N} _-]/gu, "").trim();
  try { await S.downloads.save({filename:`Facture ${number} ${safe}.pdf`, data:blob}); toast("Facture " + number + " prête"); }
  catch(e){ if (e?.code !== "declined") toast("Téléchargement impossible ici."); }
}

function darkLogo(){
  return new Promise(res => {
    if (!LOGO) return res(null);
    const img = new Image();
    img.onload = () => { try {
      const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
      const x = c.getContext("2d"); x.drawImage(img, 0, 0);
      const d = x.getImageData(0, 0, c.width, c.height);
      for (let i = 0; i < d.data.length; i += 4){ d.data[i] = 255 - d.data[i]; d.data[i+1] = 255 - d.data[i+1]; d.data[i+2] = 255 - d.data[i+2]; }
      x.putImageData(d, 0, 0); res({url:c.toDataURL("image/png"), w:img.width, h:img.height});
    } catch(e){ res(null); } };
    img.onerror = () => res(null); img.src = LOGO;
  });
}
async function buildInvoicePdf(L, o){
  // o: {number, dateStr, periodStr, me:[lines], client:[lines], pct, lines:[{name,qty,pu,gross,due}], stores:[...], gross, comm, due, notes:[str], logo:{bytes,w,h}|null}
  const {PDFDocument, StandardFonts, rgb} = L;
  const pdf = await PDFDocument.create();
  const F = await pdf.embedFont(StandardFonts.Helvetica), FB = await pdf.embedFont(StandardFonts.HelveticaBold);
  const mm = v => v * 72 / 25.4;
  const PW = 210, PH = 297, M = 16;
  let page = pdf.addPage([mm(PW), mm(PH)]);
  const clean = s => String(s ?? "").replace(/[  ]/g, " ").replace(/[^\x20-\x7E -ÿ€–—’‘“”…•]/g, "");
  const ink = rgb(.08,.08,.09), grey = rgb(.45,.45,.47);
  const text = (t, x, y, {size = 10, bold = false, color = ink, align = "left"} = {}) => {
    t = clean(t); const f = bold ? FB : F; const w = f.widthOfTextAtSize(t, size);
    const px = align === "right" ? mm(x) - w : align === "center" ? mm(x) - w / 2 : mm(x);
    page.drawText(t, {x:px, y:mm(PH - y), size, font:f, color});
  };
  const wrap = (t, size, maxMm, bold) => {
    const f = bold ? FB : F, words = clean(t).split(/\s+/), out = []; let cur = "";
    for (const w of words){ const tt = cur ? cur + " " + w : w; if (f.widthOfTextAtSize(tt, size) > mm(maxMm) && cur){ out.push(cur); cur = w; } else cur = tt; }
    if (cur) out.push(cur); return out;
  };
  const rect = (x, y, w, h, color) => page.drawRectangle({x:mm(x), y:mm(PH - y - h), width:mm(w), height:mm(h), color});
  const hline = (x1, x2, y, th = .6, color = ink) => page.drawLine({start:{x:mm(x1), y:mm(PH - y)}, end:{x:mm(x2), y:mm(PH - y)}, thickness:th, color});

  if (o.logo){ const img = await pdf.embedPng(o.logo.bytes); const h = 22, w = h * o.logo.w / o.logo.h; page.drawImage(img, {x:mm(M), y:mm(PH - 14 - h), width:mm(w), height:mm(h)}); }
  text("FACTURE", PW - M, 22, {size:22, bold:true, align:"right"});
  text("N° " + o.number, PW - M, 29, {align:"right"});
  text("Date : " + o.dateStr, PW - M, 34, {align:"right"});
  text("Période : " + o.periodStr, PW - M, 39, {align:"right"});
  if (o.storeStr) text(o.storeStr, PW - M, 44, {align:"right"});
  const block = (x, y, title, lines) => {
    text(title, x, y, {size:8.5, bold:true, color:grey}); let yy = y + 5.5;
    lines.filter(Boolean).forEach((l, i) => wrap(l, 10, 82, i === 0).forEach(t => { text(t, x, yy, {bold:i === 0}); yy += 4.8; }));
    return yy;
  };
  let y = Math.max(block(M, 56, "ÉMETTEUR", o.me), block(PW / 2 + 6, 56, "CLIENT", o.client)) + 6;

  const table = (head, rows, widths, aligns, {size = 9, headFill = rgb(.08,.08,.09), headInk = rgb(1,1,1), zebra = true, boldLast = false} = {}) => {
    const rowH = size * .55 + 3.4; let x0 = M;
    const cell = (t, i, yy, opts) => {
      const x = aligns[i] === "right" ? x0 + widths.slice(0, i + 1).reduce((a,b) => a + b, 0) - 2 : aligns[i] === "center" ? x0 + widths.slice(0, i).reduce((a,b) => a + b, 0) + widths[i] / 2 : x0 + widths.slice(0, i).reduce((a,b) => a + b, 0) + 2;
      text(t, x, yy, {size, align:aligns[i], ...opts});
    };
    rect(M, y, widths.reduce((a,b) => a + b, 0), rowH, headFill);
    head.forEach((h, i) => cell(h, i, y + rowH - 2.3, {bold:true, color:headInk}));
    y += rowH;
    rows.forEach((r, ri) => {
      if (y > PH - 30){ page = pdf.addPage([mm(PW), mm(PH)]); y = 20; }
      if (zebra && ri % 2) rect(M, y, widths.reduce((a,b) => a + b, 0), rowH, rgb(.96,.957,.945));
      r.forEach((t, i) => cell(t, i, y + rowH - 2.3, {bold: boldLast && i === r.length - 1}));
      y += rowH;
    });
    hline(M, M + widths.reduce((a,b) => a + b, 0), y, .4, rgb(.8,.8,.8));
  };
  table(["Désignation", "Qté", "Prix de vente", "Total ventes", "Commission (" + o.pct + ")", "Montant dû"],
    o.lines.map(l => [l.name, String(l.qty), o.eur(l.pu), o.eur(l.gross), "- " + o.eur(l.gross - l.due), o.eur(l.due)]),
    [54, 12, 26, 28, 34, 24], ["left", "center", "right", "right", "right", "right"], {boldLast:true});
  y += 9;
  const tx = PW - M - 92;
  text("Total des ventes en magasin", tx, y); text(o.eur(o.gross), PW - M, y, {align:"right"}); y += 6;
  text("Commission GIMS (" + o.pct + ")", tx, y); text("- " + o.eur(o.comm), PW - M, y, {align:"right"}); y += 3;
  hline(tx, PW - M, y, .8); y += 6;
  text("NET À PAYER", tx, y, {size:12, bold:true}); text(o.eur(o.due), PW - M, y, {size:12, bold:true, align:"right"});
  y += 12;
  if (o.stores.length > 1){
    table(["Détail par magasin", "Qté", "Total ventes", "Montant dû"], o.stores.map(s => [s.name, String(s.qty), o.eur(s.gross), o.eur(s.due)]),
      [92, 18, 34, 34], ["left", "center", "right", "right"], {size:8.5, headFill:rgb(.92,.91,.89), headInk:ink});
    y += 10;
  }
  o.notes.filter(Boolean).forEach(n => { wrap(n, 9, PW - 2 * M).forEach(t => { if (y > PH - 15){ page = pdf.addPage([mm(PW), mm(PH)]); y = 20; } text(t, M, y, {size:9, color:grey}); y += 4.6; }); y += 2; });
  return await pdf.save();
}
const pdfEur = n => (n == null || isNaN(n)) ? "-" : new Intl.NumberFormat("fr-FR", {minimumFractionDigits:2, maximumFractionDigits:2}).format(n).replace(/[\u202f\u00a0]/g, " ") + " €";
async function invoicePdf(mk, loc, D, number, issuedAt){
  const L = window.PDFLib; if (!L?.PDFDocument) throw new Error("pdf-lib indisponible");
  const info = S.settings.invoice || {}, c = S.settings.consign || {};
  const lg = await darkLogo();
  let logo = null;
  if (lg){ const bin = atob(lg.url.split(",")[1]); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); logo = {bytes:u, w:lg.w, h:lg.h}; }
  const bytes = await buildInvoicePdf(L, {
    number, dateStr:new Date(issuedAt).toLocaleDateString("fr-FR"), periodStr:"ventes de " + monthLabel(mk),
    me:[info.myName, ...(info.myAddress || "").split("\n"), info.siret && "SIRET : " + info.siret, info.email, info.phone],
    client:(b => [b.name || loc?.name, ...(b.address || "").split("\n"), b.siret && "SIRET : " + b.siret, b.vat && "TVA : " + b.vat, b.email])(billingOf(loc)),
    storeStr: loc?.name ? "Magasin : " + loc.name : "",
    pct: c.mode === "fixed" ? pdfEur(c.value) + " / pièce" : String(c.value).replace(".", ",") + " %",
    eur:pdfEur, lines:D.lines, stores:D.stores, gross:D.gross, comm:D.comm, due:D.due, notes:[info.vatNote, info.terms], logo
  });
  return new Blob([bytes], {type:"application/pdf"});
}

  $$("[data-th]", v).forEach(b => b.onclick = () => saveTh(Math.max(0, (Number(th.value)||0) + Number(b.dataset.th))));
  th.onchange = () => saveTh(Math.max(0, Math.floor(Number(th.value)||0)));
  $("#exjson", v).onclick = async () => { try { localStorage.setItem("rr.lastBackup", String(Date.now())); } catch(e){} save(`Revolve-Stock-sauvegarde-${today()}.json`, await window.__backup()); };
  $("#imjson", v).onclick = () => window.__pickBackup();
